name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: sdkmanager --install "platforms;android-34" "build-tools;34.0.0" "platform-tools"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Locate Gradle project
        id: loc
        run: |
          SETTINGS=$(find . -path '*/build/*' -prune -o \( -name 'settings.gradle' -o -name 'settings.gradle.kts' \) -print | head -1)
          if [ -z "$SETTINGS" ]; then
            echo "::error::settings.gradle не найден — проверьте, что файлы проекта загружены."
            ls -la; exit 1
          fi
          DIR=$(dirname "$SETTINGS")
          echo "Проект Gradle найден в: $DIR"
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "${{ steps.loc.outputs.dir }}/app/ctvt-release.keystore"
            echo "Release keystore decoded."
          else
            echo "::warning::KEYSTORE_BASE64 secret not set — release APK will be UNSIGNED."
          fi

      - name: Build release APK
        working-directory: ${{ steps.loc.outputs.dir }}
        env:
          CTVT_KEYSTORE: ctvt-release.keystore
          CTVT_STORE_PW: ${{ secrets.KEYSTORE_PASSWORD }}
          CTVT_KEY_ALIAS: ctvt
          CTVT_KEY_PW: ${{ secrets.KEY_PASSWORD }}
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: crypto-tv-terminal-release
          path: ${{ steps.loc.outputs.dir }}/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
